---
layout: default
tags: home
---
<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search title, author, or keyword...">
    
    <select id="typeFilter">
        <option value="">All Types</option>
    </select>

    <select id="yearFilter">
        <option value="">All Years</option>
    </select>

    <select id="venueTagFilter">
        <option value="">All Venues</option>
    </select>
</div>

<div id="pubListContainer">Loading publications...</div>

<script>
    let allPublications = [];

    async function init() {
        try {
            const response = await fetch('{{ "/assets/data/publications.json" | relative_url }}');
            const data = await response.json();
            allPublications = data.sort((a, b) => b.year - a.year);
            
            populateFilters(allPublications); 
            
            renderList(allPublications);
        } catch (e) {
            document.getElementById('pubListContainer').innerHTML = "Error loading data.";
        }
    }

    function populateFilters(data) {
        const typeSelect = document.getElementById('typeFilter');
        const yearSelect = document.getElementById('yearFilter');
        const venueSelect = document.getElementById('venueTagFilter');

        // 1. Populate Types (Alphabetical)
        const types = [...new Set(data.map(p => p.type))].sort();
        types.forEach(t => {
            if(t) typeSelect.innerHTML += `<option value="${t}">${t}</option>`;
        });

        // 2. Populate Years (Descending: 2026, 2025...)
        const years = [...new Set(data.map(p => p.year))].sort((a, b) => b - a);
        years.forEach(y => {
            if(y) yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
        });

        // 3. Populate Venue Tags (Alphabetical: AAAI, CVPR, ICRA...)
        const venueTags = [...new Set(data.map(p => p.venue_tag))]
            .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

        venueTags.forEach(tag => {
            if(tag) venueSelect.innerHTML += `<option value="${tag}">${tag}</option>`;
        });
    }

    function setupFilters() {
        const yearSelect = document.getElementById('yearFilter');
        const venueSelect = document.getElementById('venueTagFilter');

        // Extract unique years and sort descending
        const years = [...new Set(allPublications.map(p => p.year))].sort((a, b) => b - a);
        years.forEach(y => yearSelect.innerHTML += `<option value="${y}">${y}</option>`);

        // Extract unique venue_tags
        // We use a Set to ensure tags are unique even if multiple papers share one
        const venueTags = [...new Set(allPublications.map(p => p.venue_tag))].sort();
        venueTags.forEach(tag => {
            if(tag) venueSelect.innerHTML += `<option value="${tag}">${tag}</option>`;
        });
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const year = document.getElementById('yearFilter').value;
        const venueTag = document.getElementById('venueTagFilter').value;

        const filtered = allPublications.filter(p => {
            const matchesSearch = (p.title + p.authors + p.venue).toLowerCase().includes(query);
            const matchesType = !type || p.type === type;
            const matchesYear = !year || p.year.toString() === year;
            // Filtering logic now checks the venue_tag specifically
            const matchesVenue = !venueTag || p.venue_tag === venueTag;
            
            return matchesSearch && matchesType && matchesYear && matchesVenue;
        });

        renderList(filtered);
    }

    function renderList(data) {
        const container = document.getElementById('pubListContainer');
        
        if (!data.length) {
            container.innerHTML = '<p>No matching publications found.</p>';
            return;
        }

        container.innerHTML = data.map(p => {
            const highlightedAuthors = p.authors
                .replace(/Tamlin Love/g, '<strong>Tamlin Love</strong>')
                .replace(/T\. Love/g, '<strong>T. Love</strong>');

            return `
                <div class="pub-item" style="margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                    <span class="pub-title" style="font-weight: bold; color: #0056b3; font-size: 1.1rem;">${p.title}</span>
                    
                    <div class="pub-authors" style="margin: 5px 0; color: #444;">${highlightedAuthors}</div>
                    
                    <div class="pub-meta" style="font-size: 0.9em; color: #666;">
                        <strong>${p.venue}</strong> (${p.year}) | 
                        <span style="text-transform: uppercase; font-weight: 600;">${p.type}</span>
                    </div>

                    ${p.note ? `<span class="pub-note" style="display: block; font-size: 0.85rem; font-style: italic; color: #d9534f; margin-top: 5px;">${p.note}</span>` : ''}

                    <div class="pub-links" style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;">
                        ${p.paper ? `<a href="${p.paper}" class="pub-link-btn" target="_blank">PDF</a>` : ''}
                        ${p.code ? `<a href="${p.code}" class="pub-link-btn" target="_blank">Code</a>` : ''}
                        ${p.video ? `<a href="${p.video}" class="pub-link-btn" target="_blank">Video</a>` : ''}
                        ${p.supplementary ? `<a href="${p.supplementary}" class="pub-link-btn" target="_blank">Supp.</a>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Event listeners for real-time filtering
    document.querySelectorAll('.filter-bar input, .filter-bar select').forEach(el => {
        el.addEventListener('input', filterData);
    });

    init();
</script>
