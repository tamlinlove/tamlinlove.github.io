---
layout: default
tags: home
---
<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search title, author, or keyword...">
    
    <select id="typeFilter">
        <option value="">All Types</option>
        <option value="Conference Paper">Conference Paper</option>
        <option value="Journal">Journal</option>
    </select>

    <select id="yearFilter">
        <option value="">All Years</option>
    </select>

    <select id="venueFilter">
        <option value="">All Venues</option>
    </select>
</div>

<div id="pubContainer">Loading publications...</div>

<script>
    let allPublications = [];

    async function init() {
        try {
            const response = await fetch('{{ "/assets/data/publications.json" | relative_url }}'); 
            // Note: Adjust the path above to where your JSON is stored
            allPublications = await response.json();
            
            populateDropdowns();
            renderList(allPublications);
        } catch (e) {
            document.getElementById('pubContainer').innerHTML = "Failed to load publications.";
        }
    }

    function populateDropdowns() {
        const years = [...new Set(allPublications.map(p => p.year))].sort((a, b) => b - a);
        const venues = [...new Set(allPublications.map(p => p.venue))].sort();

        const yearSelect = document.getElementById('yearFilter');
        const venueSelect = document.getElementById('venueFilter');

        years.forEach(y => yearSelect.innerHTML += `<option value="${y}">${y}</option>`);
        venues.forEach(v => venueSelect.innerHTML += `<option value="${v}">${v}</option>`);
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const year = document.getElementById('yearFilter').value;
        const venue = document.getElementById('venueFilter').value;

        const filtered = allPublications.filter(p => {
            const matchesSearch = (p.title + p.authors + p.venue).toLowerCase().includes(query);
            const matchesType = !type || p.type === type;
            const matchesYear = !year || p.year.toString() === year;
            const matchesVenue = !venue || p.venue === venue;
            return matchesSearch && matchesType && matchesYear && matchesVenue;
        });

        renderList(filtered);
    }

    function renderList(data) {
        const container = document.getElementById('pubContainer');
        container.innerHTML = data.length ? data.map(p => `
            <div class="pub-item">
                <span class="pub-title">${p.title}</span>
                <p class="pub-authors">${p.authors}</p>
                <div class="pub-meta">
                    <span class="pub-tag">${p.type}</span> | ${p.venue} | ${p.year}
                </div>
            </div>
        `).join('') : '<p>No results found.</p>';
    }

    document.querySelectorAll('.filter-bar input, .filter-bar select').forEach(el => {
        el.addEventListener('input', filterData);
    });

    init();
</script>
